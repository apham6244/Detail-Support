<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12203c"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="clearcoat" cx="0.3" cy="0.0" r="0.95">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.26"/>
      <stop offset="0.4" stop-color="#3B82F6" stop-opacity="0.05"/>
      <stop offset="0.7" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.58" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.66" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="alu" x1="0.15" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5f9"/>
      <stop offset="0.26" stop-color="#cdd5e0"/>
      <stop offset="0.5" stop-color="#a3adbb"/>
      <stop offset="0.66" stop-color="#828d9c"/>
      <stop offset="0.8" stop-color="#b4becc"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1e63e0"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#050a16" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="sparkleglow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="tileclip"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#navy)"/>
  <g clip-path="url(#tileclip)">
    <rect width="128" height="128" fill="url(#clearcoat)"/>
    <rect width="128" height="128" fill="url(#sheen)"/>
  </g>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1"/>

  <g clip-path="url(#tileclip)">
    <path d="M34 100 C 56 108 84 104 106 80 C 92 92 60 96 40 90 Z" fill="#3B82F6" opacity="0.5" filter="url(#glow)"/>
    <path d="M34 100 C 56 108 84 104 106 80 C 92 92 60 96 40 90 Z" fill="url(#swoosh)"/>
    <path d="M39 92 C 58 99 82 96 103 78" fill="none" stroke="#eff6ff" stroke-opacity="0.65" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <g filter="url(#softshadow)" transform="translate(-4,0)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path id="d" d="M30 34 V94 M30 34 H46 C66 34 74 47 74 64 C74 81 66 94 46 94 H30"/>
      <path id="s" d="M106 49 C101 40 90 37 85 45 C80 53 87 61 96 65 C105 69 110 78 104 86 C98 93 86 91 81 80"/>
      <use href="#d" stroke="#141c2e" stroke-width="17.5"/>
      <use href="#s" stroke="#141c2e" stroke-width="16"/>
      <use href="#d" stroke="url(#alu)" stroke-width="14.5"/>
      <use href="#s" stroke="url(#alu)" stroke-width="13"/>
      <use href="#d" stroke="url(#glass)" stroke-width="14.5"/>
      <use href="#s" stroke="url(#glass)" stroke-width="13"/>
    </g>
  </g>

  <g>
    <path d="M104 22 L106.4 29.6 L114 32 L106.4 34.4 L104 42 L101.6 34.4 L94 32 L101.6 29.6 Z" fill="#bfdbfe" opacity="0.7" filter="url(#sparkleglow)"/>
    <path d="M104 24 L105.8 30.2 L112 32 L105.8 33.8 L104 40 L102.2 33.8 L96 32 L102.2 30.2 Z" fill="#ffffff"/>
  </g>
</svg>
