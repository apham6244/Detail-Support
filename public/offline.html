<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <title>You're offline · Detail Support</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: "Sora", "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
        color: #eaeef7;
        background:
          radial-gradient(120% 130% at 12% -10%, rgba(46,123,255,0.20) 0%, transparent 46%),
          radial-gradient(120% 120% at 108% 120%, rgba(122,91,224,0.16) 0%, transparent 52%),
          linear-gradient(135deg, #0b0f17 0%, #141b29 52%, #0b0f17 100%);
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 380px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .badge {
        width: 76px; height: 76px;
        display: grid; place-items: center;
        border-radius: 20px;
        background: linear-gradient(135deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 10px 34px -14px rgba(0,0,0,0.6);
        margin-bottom: 22px;
      }
      .badge svg { width: 38px; height: 38px; }
      h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px; }
      p { margin: 0; font-family: "Inter", system-ui, sans-serif; font-size: 15px; line-height: 1.55; color: #a7b1c7; }
      .dot {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 20px; padding: 7px 14px; border-radius: 999px;
        font-family: "Inter", system-ui, sans-serif; font-size: 12.5px; font-weight: 600;
        color: #ffb4ad; background: rgba(225,72,60,0.12); border: 1px solid rgba(225,72,60,0.25);
      }
      .dot i { width: 8px; height: 8px; border-radius: 50%; background: #e1483c; display: inline-block; }
      .dot.online { color: #7ee3b0; background: rgba(23,168,103,0.14); border-color: rgba(23,168,103,0.3); }
      .dot.online i { background: #17a867; }
      button {
        margin-top: 26px; width: 100%; height: 50px;
        border: 0; border-radius: 14px; cursor: pointer;
        font-family: "Inter", system-ui, sans-serif; font-size: 15px; font-weight: 700; color: #fff;
        background: linear-gradient(180deg, #5b8eff 0%, #1e63e0 100%);
        box-shadow: 0 2px 6px -1px rgba(46,123,255,0.32), 0 10px 24px -6px rgba(46,123,255,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
        transition: transform 0.12s ease, filter 0.12s ease;
      }
      button:active { transform: scale(0.97); filter: brightness(0.96); }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#dbe4f0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Detail Support can't reach the network right now. Check your connection — your work is safe and we'll reconnect automatically.</p>
      <span class="dot" id="status" role="status" aria-live="polite"><i></i> No connection</span>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      var status = document.getElementById("status");
      var retry = document.getElementById("retry");
      function reload() { location.reload(); }
      retry.addEventListener("click", reload);
      function sync() {
        if (navigator.onLine) {
          status.className = "dot online";
          status.innerHTML = "<i></i> Back online — reconnecting…";
          setTimeout(reload, 600);
        }
      }
      window.addEventListener("online", sync);
      sync();
    </script>
  </body>
</html>
